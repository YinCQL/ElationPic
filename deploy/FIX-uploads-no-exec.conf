# =============================================================================
#  Elation Image — /uploads/ 禁止执行 PHP（修复任意代码执行）
#
#  背景：当前 /uploads/xxx.php 会被 PHP-FPM 执行（实测 Body = EXECUTED_42），
#        这是严重漏洞。设计要求 §14 把它列为五层防护之一，
#        §16 明确要求，§41 列为第一优先级。
#
#  原理：把这一整段**放在处理 .php 的通用规则之前**。
#        nginx 对上层的正则 location 按**出现顺序**匹配，
#        先出现的先胜出；因此本段必须排在通用的 location ~ \.php$ 之前。
#
#  放置位置（任选其一）：
#    A. 小皮面板 →「网站」→ 该站点 →「配置文件」，把本段粘到
#       location ~ \.php 那条规则**之前**
#    B. 若面板提供「伪静态」输入框，也可粘贴本段（同样会被 include 进 server 块）
# =============================================================================

# 精确匹配 /uploads/ 前缀，优先级高于后续的正则 location。
# 块内**没有任何 fastcgi_pass**，因此该目录在架构上不可能进入 PHP-FPM。
location ^~ /uploads/ {
    # 该目录下的一切脚本类扩展名一律 403（不执行、也不返回源码）
    location ~* \.(php|php[0-9]?|phtml|phar|phps|pht|inc|module|cgi|pl|py|rb|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|htaccess|htpasswd|ini|conf|sql|bak|swp|sh|bat|cmd|exe|dll|so|env)$ {
        return 403;
    }

    # 隐藏文件不对外
    location ~ /\. {
        return 403;
    }

    # 图片：允许访问并加长缓存（文件名随机不可变）
    location ~* \.(jpg|jpeg|png|gif|webp)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 兜底：uploads 下其余任何请求（无扩展名、未知扩展名）一律拒绝
    location / {
        return 403;
    }
}
