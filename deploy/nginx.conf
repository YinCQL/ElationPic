# =============================================================================
#  Elation Image — Nginx 1.25.2 生产配置（§16 §17 §29 §30 §31）
#
#  部署前提：本文档中的站点根指向 <项目根>/public
#  即：root  /srv/elationpic/public;
#  因此 data/ 目录（database.sqlite、config.php、logs/）物理上位于 Web 根之外，
#  任何 HTTP 请求都无法到达它们。Nginx 规则是第一层，物理隔离是第二层。
#
#  验证命令见 deploy/README-DEPLOY.md
# =============================================================================

server {
    listen       80;
    server_name  image.example.com;

    # ★ 站点根 = public/
    root  /srv/elationpic/public;
    index index.php;

    charset utf-8;

    # -------------------------------------------------------------------------
    # §18 请求体大小限制（与 PHP 的 upload_max_filesize / post_max_size 对齐）
    # 10 MB 上限：留出 1 MB 余量给 multipart 边界与其他表单字段
    # 若 PHP 侧改为 20 MB，这里同步改为 21m
    # -------------------------------------------------------------------------
    client_max_body_size 11m;
    client_body_timeout  60s;
    client_header_timeout 20s;

    # -------------------------------------------------------------------------
    # §30 全局：禁止目录列表
    # -------------------------------------------------------------------------
    autoindex off;

    # -------------------------------------------------------------------------
    # §29 安全响应头
    # 注意：不在 http/server 层加 HSTS 之外的强制跳转，避免影响本地调试
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # CSP：脚本与样式全部来自本站静态文件。
    # 页面中不存在任何内联脚本 —— CSRF token 通过 <body data-csrf="..."> 传递，
    # 由 assets/app.js 读取。因此 script-src 可保持严格的 'self'，无需 'unsafe-inline'。
    set $csp_default "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # =========================================================================
    # §16 §30 上传目录：绝不执行任何脚本
    #
    # 设计要点：
    #   1. location /uploads/ 内没有任何 fastcgi_pass —— 该目录根本不接入 PHP-FPM
    #   2. 即使攻击者上传了 .php，也只会被当作静态文件下载/拒绝，不会被执行
    #   3. 显式对一切可执行扩展名返回 403，而不是依赖 MIME 猜测
    #   4. 关闭该目录下的目录列表
    # =========================================================================
    location ^~ /uploads/ {
        # 该目录下的一切脚本类扩展名一律 403
        location ~* \.(php|php[0-9]?|phtml|phar|phps|pht|inc|module|cgi|pl|py|rb|jsp|jspx|asp|aspx|ashx|asmx|shtml|shtm|htaccess|htpasswd|ini|conf|sql|bak|swp|sh|bat|cmd|exe|dll|so|env)$ {
            return 403;
        }

        # 隐藏文件（.gitkeep 等）不对外
        location ~ /\. {
            return 403;
        }

        # 只允许图片扩展名被访问（白名单，双向保险）
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # uploads 下其余任何请求（含无扩展名、双扩展名）一律拒绝，
        # 避免 a.php.jpg 这类绕过与未知内容被当作静态资源
        location / {
            return 403;
        }
    }

    # =========================================================================
    # §30 敏感文件：显式拒绝
    # data/ 已在 Web 根之外；以下规则防止误部署到平铺结构时的泄露，
    # 同时覆盖 SQLite WAL/SHM 附属文件（§3.2）
    # =========================================================================
    location ~* ^/(data|src|docs|tests|deploy)/ {
        return 403;
    }
    location ~* \.(sqlite|sqlite3|sqlite-wal|sqlite-shm|db|db-wal|db-shm)$ {
        return 403;
    }
    location ~* \.(log|ini|conf|yml|yaml|json|lock|md|dist|sample)$ {
        return 403;
    }
    location ~* ^/config\.php$ {
        return 403;
    }
    location ~ /\.(?!well-known/) {
        return 403;
    }

    # =========================================================================
    # §8 §30 PHP：只允许 public/ 下的 .php 进入 PHP-FPM
    # 规则使用 ^~ 前缀 + 精确匹配，uploads/ 已在上面被 ^~ 抢先处理
    # =========================================================================
    # 注意：路径允许**多级**，因为子目录部署时 URI 形如 /img/public/index.php。
    # 旧写法 ^/[A-Za-z0-9_-]+\.php$ 只匹配单段路径，子目录模式下 PHP 永远不会执行
    # （表现为 Nginx 直接返回 404）。
    location ~ ^(/[A-Za-z0-9_-]+)+\.php$ {
        # 双重保险：只要 URI 中**任何位置**出现 uploads 段就拒绝。
        # 必须用不带 ^ 的匹配，否则 /img/public/uploads/x.php 会漏过。
        if ($uri ~* "/uploads/") {
            return 403;
        }

        try_files $uri =404;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    120s;
        fastcgi_send_timeout    120s;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;

        # 动态页面不缓存（§31）
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_default always;
    }

    # =========================================================================
    # 首页与静态资源
    # =========================================================================
    location = / {
        # index 指令会内部转到 /index.php，由上面的 PHP location 处理
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Content-Security-Policy $csp_default always;
    }

    location ^~ /assets/ {
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        location / {
            return 403;
        }
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /robots.txt {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # =========================================================================
    # §37 错误页：不向用户暴露任何服务器细节
    # =========================================================================
    # 保留原始状态码（=NNN），并把 code 传给 error.php 以渲染对应文案。
    # 若写成 error_page 403 /error.php，返回码会变成 error.php 自身的状态，语义丢失。
    error_page 400 =400 /error.php?code=400;
    error_page 403 =403 /error.php?code=403;
    error_page 404 =404 /error.php?code=404;
    error_page 405 =405 /error.php?code=405;
    error_page 500 =500 /error.php?code=500;
    error_page 502 =502 /error.php?code=502;
    error_page 503 =503 /error.php?code=503;
    error_page 504 =504 /error.php?code=504;

    location = /error.php {
        internal;
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root/error.php;
        include        fastcgi_params;

        # 注意：nginx 的 add_header 一旦在子块中出现，就会**整体覆盖**父级继承。
        # 因此这里必须把 server 级的安全头重新声明一遍，否则错误页会丢失它们。
        # （error.php 本身也用 PHP header() 设置了这些，属于双保险。）
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # 隐藏 Nginx 版本号（需在 http 块设置 server_tokens off，
    # 若无法修改主配置，此行作为 server 级兜底）
    server_tokens off;
}

# =============================================================================
#  HTTPS 变体（生产环境推荐）
