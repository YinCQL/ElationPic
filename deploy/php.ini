; =============================================================================
;  ElationPic — PHP 8.0.2 NTS 生产配置片段（§18 §37）
;
;  用法：把以下内容追加到 php.ini 末尾，或按需修改对应行。
;  修改后必须重启 PHP-FPM / php-cgi 才生效。
; =============================================================================

; -----------------------------------------------------------------------------
; §37 错误处理：生产环境绝不向用户显示错误细节
; -----------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; 日志写到 Web 根之外
error_log = "/srv/elationpic/data/logs/php-error.log"
html_errors = Off

; -----------------------------------------------------------------------------
; §18 上传限制
; max_file_bytes 默认 10 MB，故：
;   upload_max_filesize = 10M （单文件）
;   post_max_size       = 11M （须 >= upload_max_filesize，留 multipart 余量）
;   memory_limit        = 128M（GD 处理大图需要）
; 若要把上限改为 20 MB：
;   upload_max_filesize = 20M
;   post_max_size       = 21M
;   并把 nginx.conf 的 client_max_body_size 改为 21m
;   以及 config.php 的 max_file_bytes 改为 20971520
; -----------------------------------------------------------------------------
file_uploads = On
upload_max_filesize = 10M
post_max_size = 11M
max_file_uploads = 10
memory_limit = 128M
max_execution_time = 60
max_input_time = 60

; -----------------------------------------------------------------------------
; §10 会话安全
; 注意：bootstrap.php 会在运行时再次强制设置这些值，
; 这里设置是为了让未被应用覆盖的场景（如错误页）也保持安全默认。
; use_strict_mode=1 使 PHP 拒绝未初始化过的 Session ID（防会话固定）
; -----------------------------------------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
; session.cookie_secure 由 src/bootstrap.php 在运行时按实际协议与
; config.php 的 force_https 决定，此处不要写死，
; 否则本地 HTTP 调试会因 Cookie 无法保存而登录失败。
; session.cookie_secure = 1
session.sid_length = 48
session.sid_bits_per_character = 5
session.gc_maxlifetime = 7200
; Session 文件放在 Web 根之外
session.save_path = "/srv/elationpic/data/sessions"

; -----------------------------------------------------------------------------
; §40 危险函数：图床不需要执行外部命令
; 关闭后在 PHP 层阻断命令执行类攻击面（若面板不方便改，
; 可不设置这两行，程序本身也不调用这些函数）
; -----------------------------------------------------------------------------
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; -----------------------------------------------------------------------------
; 其他加固
; -----------------------------------------------------------------------------
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
cgi.fix_pathinfo = 0

; -----------------------------------------------------------------------------
; 上传临时目录（不要指向站点可访问目录）
; -----------------------------------------------------------------------------
upload_tmp_dir = "/srv/elationpic/data/tmp"

; -----------------------------------------------------------------------------
; 时区（数据库恒存 UTC，展示时按 config.php 的 timezone 转换）
; -----------------------------------------------------------------------------
date.timezone = "UTC"
